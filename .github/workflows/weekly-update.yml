name: Data Update

on:
  # GitHubin ajastukset voivat käynnistyä tunteja myöhässä, joten ajetaan kahdesti arkipäivisin:
  # 4:00 ja 12:00 UTC = klo 6 ja 14 Suomen talviaikaa (7 ja 15 kesäaikaa).
  schedule:
    - cron: '0 4 * * 1-5'
    - cron: '0 12 * * 1-5'
  workflow_dispatch:        # Voi myös ajaa manuaalisesti

permissions:
  contents: write

# Vain yksi päivitys kerrallaan: jos edellinen on vielä käynnissä, seuraava odottaa jonossa
# (ei peruuteta kesken), joten kaksi ajoa ei kirjoita dataa yhtä aikaa.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node --test

      - name: Run update script
        run: node update_data.mjs

      - name: Commit changes
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add data.js wci_history.json ism_history.json spg_pmi_history.json
          git diff --staged --quiet || git commit -m "Automaattinen datapäivitys $(date +'%Y-%m-%d %H:%M')"
          # Jos mainiin on tullut muutoksia ajon aikana (esim. yhdistetty PR), otetaan ne mukaan ennen pushia
          git pull --rebase
          git push
