name: Data Update

on:
  schedule:
    - cron: '0 6 * * 1-5'  # Arkipäivisin klo 6:00 UTC (8:00 / 9:00 Suomen aikaa)
  workflow_dispatch:        # Voi myös ajaa manuaalisesti

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        run: node update_data.mjs

      - name: Commit changes
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add data.js wci_history.json ism_history.json spg_pmi_history.json
          git diff --staged --quiet || git commit -m "Automaattinen datapäivitys $(date +'%Y-%m-%d')"
          git push
